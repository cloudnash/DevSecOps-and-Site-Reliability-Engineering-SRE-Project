apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: leaky-app-ns
spec:
  type: ClusterIP
  selector:
    app: leaky-app # This routes traffic to v1, v2, and v3
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---

# DEPLOYMENT V1

apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaky-app-v1
  namespace: leaky-app-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaky-app
      version: v1
  template:
    metadata:
      labels:
        app: leaky-app
        version: v1
    spec:
      serviceAccountName: app-sa
      initContainers:
      - name: init-setup
        image: busybox:1.28
        command: ['sh', '-c', 'echo "Enterprise init process completed"']
        resources:           # Adding this block to add resource of initCont
          requests:          
            memory: "50Mi"   
            cpu: "50m"       
          limits:            
            memory: "50Mi"   
            cpu: "50m"
      containers:
      - name: leaky-app
        image: ghcr.io/cloudnash/leaky-app:0cad6a6799befb7580118940437183221346c837
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "400Mi" # CRITICAL: Forces OOMKilled
            cpu: "500m"
---

