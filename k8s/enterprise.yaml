apiVersion: v1
kind: Namespace
metadata:
  name: leaky-app-ns
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ns-quota
  namespace: leaky-app-ns
spec:
  hard:
    requests.memory: "1Gi"
    limits.memory: "2Gi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: leaky-app-ns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: leaky-app-ns
data:
  ENV: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: leaky-app-ns
type: Opaque
stringData:
  API_KEY: "super-secret-key"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: leaky-app-ns
spec:
  podSelector: {} # Selects all pods in this namespace
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-ingress
  namespace: leaky-app-ns
spec:
  podSelector:
    matchLabels:
      app: leaky-app
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
